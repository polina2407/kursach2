{% extends 'base.html' %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6 col-lg-4">
        <div class="card shadow">
            <div class="card-header bg-primary text-white text-center">
                <h4><i class="bi bi-person-badge"></i> Вход врача</h4>
            </div>
            <div class="card-body">
                {% if form.errors %}
                <div class="alert alert-danger">
                    <strong>Ошибка!</strong> {{ form.code.errors.0 }}
                </div>
                {% endif %}
                
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label for="id_code" class="form-label">Код доступа врача</label>
                        <input type="password" 
                               name="code" 
                               id="id_code" 
                               class="form-control" 
                               placeholder="Введите ваш код доступа"
                               required 
                               autofocus>
                        <small class="form-text text-muted">
                            Введите уникальный код доступа для входа в систему
                        </small>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary">Войти</button>
                    </div>
                </form>
            </div>
            <div class="card-footer text-muted text-center">
                <small>Для доступа к системе введите ваш персональный код</small>
            </div>
        </div>
        
        <div class="text-center mt-3">
            <a href="{% url 'login' %}" class="btn btn-outline-secondary btn-sm">
                <i class="bi bi-arrow-left"></i> Вернуться к обычному входу
            </a>
        </div>
    </div>
</div>
{% endblock %}
